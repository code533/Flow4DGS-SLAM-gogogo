# V5.0 Balloon2: read-only G0 3D Gaussian motion attribution.
# This preset deliberately does NOT activate any V4.3 candidate selection.
inherit_from: "configs/rgbd/bonn/config.yaml"

Dataset:
  dataset_path: "datasets/bonn/rgbd_bonn_balloon2"
  bound: [[-8.0,-8.5,-7.0],[8.5,8.5,8.0]]
  Calibration:
    fx: 542.822841
    fy: 542.576870
    cx: 315.593520
    cy: 237.756098
    k1: 0.039903
    k2: -0.099343
    p1: -0.00073
    p2: -0.000144
    k3: 0.0
    distorted: true
    width: 640
    height: 480
    depth_scale: 5000.0

Training:
  single_thread: true
  dystart: 43
  mask_loss: 0
  flow_ds: 1

model_params:
  v42a_propagation:
    mode: 'g0'
    # Keep legacy shadow/failure logging OFF; V5.0 owns its diagnostics.
    g34_shadow: false
    g4_ablation: false
    attribute_failures: false
    save_points: false
    online_trace: false

  v50_attribution:
    enabled: true
    every_n_event: 1
    q_threshold: 0.30
    save_points: false
    detailed_frames: [212, 357]
