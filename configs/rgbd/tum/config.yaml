Dataset:
  Calibration:
    cx: 320.1
    cy: 247.6
    depth_scale: 5000.0
    distorted: false
    fx: 535.4
    fy: 539.2
    height: 480
    k1: 0.0
    k2: 0.0
    k3: 0.0
    p1: 0.0
    p2: 0.0
    width: 640
  adaptive_pointsize: true
  dataset_path: datasets/tum/rgbd_dataset_freiburg3_walking_xyz
  pcd_downsample: 128
  pcd_downsample_init: 32
  point_size: 0.01
  seg_chair: true
  sensor_type: depth
  type: tum
Results:
  eval_rendering: true
  save_dir: results
  save_results: true
  save_trj: true
  save_trj_kf_intv: 5
  use_gui: false
  use_wandb: false
Training:
  alpha: 0.9
  edge_threshold: 1.1
#  flow_grad_loss: 10.0
  flow_loss: 3.0
  gaussian_extent: 1.0
  gaussian_reset: 2001
  gaussian_th: 0.7
  gaussian_update_every: 150
  # dygs_gaussian_update_every: 50
  gaussian_update_offset: 50
  init_gaussian_extent: 30
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_update: 100
  init_itr_num: 1050
  kf_cutoff: 0.3
  kf_interval: 5
  kf_min_translation: 0.05
  kf_overlap: 0.9
  kf_translation: 0.08
  lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001
  mapping_itr_num: 50
  mask_loss: 0.01
  offset_loss: 1.0
  pose_window: 3
  prune_mode: slam
  rgb_boundary_threshold: 0.01
  single_thread: true
  size_threshold: 20
  spherical_harmonics: false
  tracking_itr_num: 100
  window_size: 8
  stop_xyz_grad: true
model_params:
  # V4.0 observation-only, OFF by default. Logs static-only pre/post residuals.
  v40_diagnostics:
    enabled: false
    every: 10
    opacity_min: 0.95
    save_maps: true
  # V4.0a full-flow + static-map observations; no effect on SLAM optimization.
  v40a_diagnostics:
    enabled: false
    every: 10
    opacity_min: 0.95
    save_maps: true
    forward_backward: true
  data_device: cuda
  dynamic_model: offset
  # Optional V2: conservative flow + static RGB-D residual fusion for Tracking.
  # Keep V1 (rgbd_uncertainty.enabled) disabled when using this.
  flow_rgbd_v2:
    enabled: false
    warmup_iters: 6
    refresh_interval: 8
    opacity_min: 0.95
    min_depth: 0.01
    max_depth: 1000.0
    min_coverage: 0.25
    reject_depth_edges: true
    edge_threshold: 0.08
    flow_scale_floor_px: 0.30
    flow_z_threshold: 2.0
    flow_temperature: 0.50
    front_min_rel: 0.035
    front_temperature: 0.015
    rgb_min_error: 0.08
    rgb_temperature: 0.035
    candidate_threshold: 0.55
    min_weight: 0.70
    max_downweight_fraction: 0.12
    save_debug: false
    debug_every: 30
  # V2.1: interpretable two-branch flow/RGB-D fusion. OFF by default.
  # V1 and V2 must also be disabled when V2.1 is enabled.
  flow_rgbd_v21:
    enabled: false
    fusion_mode: layered        # layered | product (V2-style ablation)
    diagnostic_only: false     # true: record maps without changing Tracking
    warmup_iters: 6
    refresh_interval: 8
    opacity_min: 0.95
    min_depth: 0.01
    max_depth: 1000.0
    min_coverage: 0.25
    reject_depth_edges: true
    edge_threshold: 0.08
    flow_scale_floor_px: 0.30
    flow_z_threshold: 2.0
    flow_temperature: 0.50
    front_min_rel: 0.035
    front_temperature: 0.015
    rgb_min_error: 0.08
    rgb_temperature: 0.035
    rgb_share: 0.55
    flow_share: 0.55
    flow_prior_min: 0.35
    map_prior_min: 0.35
    layered_threshold: 0.55
    product_threshold: 0.55
    min_candidate_pixels: 32
    min_weight: 0.80
    max_downweight_fraction: 0.05
    save_debug: true
    debug_every: 30
  # V2.2: split RGB/Depth residual reliability for tracking. OFF by default.
  # V1/V2/V2.1 and V2.2 are mutually exclusive.
  flow_rgbd_v22:
    enabled: false
    mode: decoupled            # decoupled | rgb_only | depth_only | all_ones
    diagnostic_only: false
    normalization: mass_preserving   # mass_preserving | original_mean
    warmup_iters: 6
    refresh_interval: 8
    opacity_min: 0.95
    min_depth: 0.01
    max_depth: 1000.0
    min_coverage: 0.25
    reject_depth_edges: true
    edge_threshold: 0.08
    flow_scale_floor_px: 0.30
    flow_z_threshold: 2.0
    flow_temperature: 0.50
    front_min_rel: 0.035
    front_temperature: 0.015
    rgb_min_error: 0.08
    rgb_temperature: 0.035
    flow_prior_min: 0.35
    rgb_prior_min: 0.55
    depth_prior_min: 0.65
    rgb_min_weight: 0.95
    depth_min_weight: 0.80
    rgb_max_fraction: 0.015
    depth_max_fraction: 0.03
    rgb_min_candidate_pixels: 32
    depth_min_candidate_pixels: 32
    save_debug: false
    debug_every: 30
  flow_offset: true
  insertion: true
  model_path: ''
  resolution: -1
  sh_degree: 0
  source_path: ''
  use_arap: false
  use_droid: false
  use_rbf: true
  use_gmm: true
  use_gmm_rot: true
  use_rigid: false
  use_knn: true
  knn_n: 8
  depth_check: true
  # CIMD-V3.1 geometry-aware IRLS (disabled by default).
  # Disable V1-V2.2 and test V3.0 legacy clipping separately.
  flow_cam_v31:
    enabled: false
    stage: refit_only         # first_only | refit_only | both
    sampling_stride: 4
    grid_rows: 6
    grid_cols: 8
    grid_balance: 0.50
    iterations: 12
    min_points: 600
    min_cells: 12
    min_depth: 0.10
    max_depth: 15.0
    depth_edge_relative: 0.06
    depth_edge_weight: 0.35
    flow_edge_px: 3.0
    flow_edge_weight: 0.60
    robust_scale_floor_px: 0.25
    max_condition: 1.0e7
    save_debug: false
    debug_every: 30
  # V3.1a paired Shadow Mode: never changes Tracking pose.
  # Requires V3.0, V3.1 and all earlier Tracking experiments disabled.
  flow_cam_v31a:
    enabled: false
    save_debug: false
    debug_every: 1
    sampling_stride: 4
    grid_rows: 6
    grid_cols: 8
    grid_balance: 0.50
    iterations: 12
    min_points: 600
    min_cells: 12
    min_depth: 0.10
    max_depth: 15.0
    depth_edge_relative: 0.06
    depth_edge_weight: 0.35
    flow_edge_px: 3.0
    flow_edge_weight: 0.60
    robust_scale_floor_px: 0.25
    max_condition: 1.0e7
  flow_mask: true
  rgbd_uncertainty:
    enabled: false       # baseline off; turn on for V1 experiment
    warmup_iters: 3
    opacity_min: 0.95
    min_depth: 0.01
    max_depth: 1000.0
    rgb_coeff: 0.40
    depth_coeff: 0.60
    rgb_scale: 0.10
    depth_rel_scale: 0.10
    threshold: 1.60
    temperature: 0.35
    min_weight: 0.10
    min_coverage: 0.08
    binary_threshold: 0.80 # diagnostics only
    smoothing_kernel: 3
    save_debug: false
    debug_every: 30
  flow_cam: true
  # CIMD-V3.0 camera-motion diagnostics / optional translation cap.
  # V1/V2/V2.1/V2.2 should all be disabled for controlled experiments.
  flow_cam_v30:
    enabled: false              # enable for V3.0 experiments
    translation_mode: legacy    # legacy | capped (only changes translation)
    save_debug: false
    debug_every: 10
    condition_stride: 8
    save_residual_maps: false
  sd: true
  # interp_type: cube
  white_background: false
opt_params:
  deformation_lr_delay_mult: 0.01
  deformation_lr_final: 1.6e-05
  deformation_lr_init: 0.00016
  densification_interval: 100
  densify_from_iter: 500
  densify_grad_threshold: 0.0002
  densify_until_iter: 15000
  feature_lr: 0.0025
  grid_lr_final: 0.00016
  grid_lr_init: 0.0016
  iterations: 30000
  lambda_dssim: 0.2
  opacity_lr: 0.05
  opacity_reset_interval: 3000
  percent_dense: 0.01
  position_lr_delay_mult: 0.01
  position_lr_final: 1.6e-06
  position_lr_init: 0.00016
  position_lr_max_steps: 30000
  rotation_lr: 0.001
  scaling_lr: 0.001
  trbfc_lr: 0.0001
  trbfs_lr: 0.04
pipeline_params:
  compute_cov3D_python: false
  convert_SHs_python: false
